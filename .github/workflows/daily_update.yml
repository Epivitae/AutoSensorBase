name: Daily Auto-Update

on:
  schedule:
    - cron: '0 22 * * *' 
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120  # 【新增】限制最多运行30分钟，防止 API 卡死
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4  # 【升级】v3 -> v4
        with:
          fetch-depth: 0 

      - name: Set up Python
        uses: actions/setup-python@v5  # 【升级】v4 -> v5
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run ETL pipeline
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python update_daily.py

      - name: Upload Artifacts (Data Backup)
        uses: actions/upload-artifact@v4
        with:
          name: etl-data-${{ github.run_id }}
          path: |
            raw_papers.json
            processed_probes.json
            update_meta.json
          retention-days: 7 

      - name: Commit and Push changes
        run: |
          # 【修改】使用 GitHub 官方 Bot 身份，让提交记录更清晰
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add raw_papers.json processed_probes.json 
          git add update_meta.json

          
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Daily ETL Update"
            
            MAX_RETRIES=3
            count=0
            success=false
            
            until [ $count -ge $MAX_RETRIES ]
            do
              git pull --rebase origin main && git push origin main && success=true && break
              
              count=$((count+1))
              echo "Push failed, retrying in 5 seconds... ($count/$MAX_RETRIES)"
              sleep 5
            done
            
            if [ "$success" = false ]; then
              echo "Failed to push after $MAX_RETRIES attempts."
              exit 1
            fi
          fi
