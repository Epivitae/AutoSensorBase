name: Process New Probe Issue

on:
  issues:
    types: [opened, edited]

jobs:
  process-probe:
    if: contains(github.event.issue.labels.*.name, 'auto-add')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Parse Issue Body
        uses: stefanbuck/github-issue-parser@v3
        id: issue-parser
        with:
          template_path: .github/ISSUE_TEMPLATE/add_probe.yml

      - name: Run AI Data Analyzer
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ISSUE_JSON_DATA: ${{ steps.issue-parser.outputs.jsonString }}
        run: |
          python -c "
          import os, json
          # 导入你新增的管道函数
          from data_analyzer import process_issue_pipeline
          
          # 读取 GitHub 表单数据
          user_inputs = json.loads(os.environ['ISSUE_JSON_DATA'])
          
          # 运行处理逻辑
          final_data = process_issue_pipeline(user_inputs)
          print('--- Final Extracted Data ---')
          print(json.dumps(final_data, indent=4))
          "