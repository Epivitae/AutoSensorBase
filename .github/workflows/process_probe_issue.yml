name: Process New Probe Issue

on:
  issues:
    types: [opened, edited]

jobs:
  process-probe:

    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests

      - name: Parse Issue Body
        id: issue-parser
        run: |
          echo "jsonString={}" >> $GITHUB_OUTPUT

      - name: Run AI Data Analyzer
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          ISSUE_JSON_DATA: ${{ steps.issue-parser.outputs.jsonString }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python -c "
          import os, json, re
          from data_analyzer import process_issue_pipeline
          
          user_inputs = json.loads(os.environ.get('ISSUE_JSON_DATA', '{}'))
          print('--- Debug: Parsed JSON Data ---')
          print(json.dumps(user_inputs, indent=2))
          
          raw_body = os.environ.get('ISSUE_BODY', '')
          
          # 2. 🌟 双保险 1：用正则从原始文本强抓 DOI
          if not user_inputs.get('probe_doi'):
              match = re.search(r'(10\.\d{4,9}/[-._;()/:A-Z0-9a-z]+)', raw_body)
              if match:
                  extracted_doi = match.group(1)
                  print(f'🔧 Regex successfully extracted DOI: {extracted_doi}')
                  user_inputs['probe_doi'] = extracted_doi
                  
          # 3. 🌟 双保险 2：用正则从原始文本强抓人工摘要 (Abstract)
          if not user_inputs.get('probe_abstract'):
              # 匹配 '### Paper Abstract' 下方，直到下一个 '###' 或文本结尾的内容
              abs_match = re.search(r'###\s*Paper Abstract.*?\n+(.*?)(?=\n###|\Z)', raw_body, re.DOTALL | re.IGNORECASE)
              if abs_match:
                  extracted_abs = abs_match.group(1).strip()
                  # 过滤掉 GitHub 自动生成的空占位符
                  if extracted_abs and extracted_abs not in ['_No response_', 'No response', 'None']:
                      print(f'🔧 Regex successfully extracted manual Abstract! (Length: {len(extracted_abs)})')
                      user_inputs['probe_abstract'] = extracted_abs
          
          # 4. 运行处理逻辑
          final_data = process_issue_pipeline(user_inputs)
          print('\n--- Final Extracted Data ---')
          print(json.dumps(final_data, indent=4, ensure_ascii=False))
          
          # 5. 写入数据库
          if final_data and final_data.get('is_new'):
              db_path = 'processed_probes.json'
              if os.path.exists(db_path):
                  with open(db_path, 'r', encoding='utf-8') as f:
                      try:
                          db = json.load(f)
                      except json.JSONDecodeError:
                          db = []
              else:
                  db = []
              
              existing_dois = [item.get('doi') for item in db]
              if final_data.get('doi') not in existing_dois:
                  db.append(final_data)
                  with open(db_path, 'w', encoding='utf-8') as f:
                      json.dump(db, f, indent=4, ensure_ascii=False)
                  print('✅ 成功将新探针写入 processed_probes.json')
                  
                  # 👇 新增：只有在成功写入新数据时，才同步打上最新的时间戳
                  try:
                      from data_fetcher import save_update_timestamp
                      save_update_timestamp()
                  except Exception as e:
                      print(f'⚠️ 更新时间戳失败: {e}')
              else:
                  print('⚠️ 该探针 (DOI) 已存在于数据库中，跳过写入。')
          else:
              print('ℹ️ AI 判定该文献并非新探针开发 (is_new: false)，不写入数据库。')
          "

      # 5. 🌟 自动提交更改回 GitHub 仓库
      - name: Commit and Push changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 auto-add: New probe added from issue #${{ github.event.issue.number }}"
          file_pattern: 'processed_probes.json update_meta.json'