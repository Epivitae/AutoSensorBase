name: "🧬 添加新探针 (Add New Probe)"
description: "提交 DOI 和探针名称，机器人将自动处理并加入数据库"
title: "[New Probe]: "
labels: ["auto-add"]
body:
  - type: input
    id: probe_name
    attributes:
      label: "探针名称"
      description: "例如: GCaMP8, CaBLAM"
      placeholder: "输入探针名称"
    validations:
      required: true
  - type: input
    id: probe_doi
    attributes:
      label: "论文 DOI"
      description: "例如: 10.1038/s41592-024-02202-x"
      placeholder: "输入完整 DOI 或 10.xxxx 格式"
    validations:
      required: true
  - type: input
    id: probe_target
    attributes:
      label: "检测底物 (Target)"
      description: "例如: Calcium, Dopamine. [选填] 如果留空，将由 AI 尝试从摘要中提取"
      placeholder: "留空则使用 AI 提取"
    validations:
      required: false
  - type: dropdown
    id: probe_color
    attributes:
      label: "发光颜色 (Color)"
      description: "[选填] 选择探针颜色。如果不在列表中，请选择“其他”并在下方填写"
      options:
        - "由 AI 自动提取"
        - "Green"
        - "Red"
        - "Blue"
        - "Yellow"
        - "Orange"
        - "Purple"
        - "其他 (请在下方填写)"
    validations:
      required: false
  - type: input
    id: probe_color_custom
    attributes:
      label: "其他颜色 (Custom Color)"
      description: "如果在上方选择了“其他”，请在此处输入具体的颜色（例如：Far-Red, NIR）"
      placeholder: "例如: Far-Red"
    validations:
      required: false
  - type: input
    id: probe_type
    attributes:
      label: "探针类型 (Type)"
      description: "例如: GECI, GPCR-based, snifit. [选填] 留空则使用 AI 自动提取"
      placeholder: "留空则使用 AI 提取"
    validations:
      required: false