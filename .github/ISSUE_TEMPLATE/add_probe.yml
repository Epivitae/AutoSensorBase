name: "🧬 Add New Probe"
description: "Submit a DOI and probe name. The bot will automatically process and add it to the database."
title: "[New Probe]: "
labels: ["auto-add"]
body:
  - type: input
    id: probe_doi
    attributes:
      label: "Paper DOI"
      description: "e.g., 10.1038/s41592-024-02202-x. This is the ONLY required field."
      placeholder: "Enter full DOI or 10.xxxx format"
    validations:
      required: true 

  - type: input
    id: probe_name
    attributes:
      label: "Probe Name"
      description: "[Optional] e.g., GCaMP8, CaBLAM. Leave blank to let AI extract it from the paper."
      placeholder: "Leave blank for AI extraction"
    validations:
      required: false

  - type: input
    id: probe_target
    attributes:
      label: "Target"
      description: "[Optional] e.g., Calcium, Dopamine. Leave blank to let AI extract it."
      placeholder: "Leave blank for AI extraction"
    validations:
      required: false

  - type: dropdown
    id: probe_color
    attributes:
      label: "Emission Color"
      description: "[Optional] Select the emission color. Leave as default to let AI extract it."
      options:
        - "Auto (Extract by AI)"
        - "Green"
        - "Red"
        - "Blue"
        - "Yellow"
        - "Orange"
        - "Purple"
        - "Other (Fill below)"
    validations:
      required: false

  - type: input
    id: probe_color_custom
    attributes:
      label: "Custom Color"
      description: "[Optional] If you selected 'Other' above, enter the specific color here (e.g., Far-Red, NIR)."
      placeholder: "e.g., Far-Red"
    validations:
      required: false

  - type: input
    id: probe_type
    attributes:
      label: "Probe Type"
      description: "[Optional] e.g., Ion Sensor, GPCR-based. Leave blank to let AI classify it."
      placeholder: "Leave blank for AI classification"
    validations:
      required: false