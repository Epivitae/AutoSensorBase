<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AutoSensorBase - Global Visitors</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body {
            width: 100%;
            height: 100%;
            background: transparent;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        #counter-text {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(6px);
            -webkit-backdrop-filter: blur(6px);
            padding: 3px 14px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: 600;
            color: #4A5568;
            pointer-events: none;
            white-space: nowrap;
            border: 1px solid rgba(0, 0, 0, 0.06);
            z-index: 10;
        }
    </style>
</head>
<body>
    <canvas id="globe-canvas" width="500" height="500"></canvas>
    <span id="counter-text">Visitors: ...</span>

    <script type="module">
        import createGlobe from "https://esm.sh/cobe@0.6.5";

        const WORKER_URL = "https://asb-visitors.office-526.workers.dev";

        const canvas = document.getElementById("globe-canvas");
        const counterEl = document.getElementById("counter-text");

        // ── Fetch data first, then create globe ─────────────

        async function init() {
            let markers = [];
            let total = 0;

            // 1. Fetch visitor data from Worker
            try {
                const resp = await fetch(WORKER_URL);
                if (!resp.ok) throw new Error("HTTP " + resp.status);
                const data = await resp.json();
                total = data.total || 0;
                if (data.locations && data.locations.length > 0) {
                    markers = data.locations.map((loc) => ({
                        location: [loc.lat, loc.lng],
                        size: 0.05,
                    }));
                }
                counterEl.textContent =
                    "Visitors: " + total.toLocaleString();
            } catch (err) {
                console.warn("Worker fetch failed:", err);
                counterEl.textContent =
                    "Err: " + (err.message || String(err)).slice(0, 30);
                // Fallback marker
                markers = [
                    { location: [31.2304, 121.4737], size: 0.06 },
                ];
            }

            // 2. Create globe with the fetched markers
            let phi = 0;
            createGlobe(canvas, {
                devicePixelRatio: 2,
                width: 500,
                height: 500,
                phi: 0,
                theta: 0.28,
                dark: 0,
                diffuse: 1.2,
                mapSamples: 8000,
                mapBrightness: 6,
                baseColor: [1, 1, 1],
                markerColor: [0.1, 0.5, 1],
                glowColor: [1, 1, 1],
                markers: markers,
                onRender: (state) => {
                    state.phi = phi;
                    phi += 0.005;
                },
            });
        }

        init();
    </script>
</body>
</html>
