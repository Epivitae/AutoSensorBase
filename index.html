<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto Sensor Base (ASB)</title>
    <link rel="icon" href="/image/pulumi.svg" type="image/svg+xml">
    <style>
        /* ================= 1. 主题配色 ================= */
        :root {
            --bg-color: #F7F9FB;
            --sidebar-bg: #FFFFFF;
            --text-main: #2D3748;
            --text-sidebar: #1A202C;
            --meta-color: #718096;
            --border-color: #E2E8F0;
            --card-bg: #FFFFFF;
            --btn-border: #CBD5E0;
            --badge-target-bg: #E6FFFA;
            --badge-target-text: #2C7A7B;
            --badge-type-bg: #EDF2F7;
            --badge-type-text: #4A5568;
            --globe-shadow: 0 0 0 1px rgba(0,0,0,0.04), 0 4px 16px rgba(0,0,0,0.04);
        }

        [data-theme="dark"] {
            --bg-color: #171923;
            --sidebar-bg: #1A202C;
            --text-main: #E2E8F0;
            --text-sidebar: #E2E8F0;
            --meta-color: #A0AEC0;
            --border-color: #2D3748;
            --card-bg: #1A202C;
            --btn-border: #4A5568;
            --badge-target-bg: #1C4532;
            --badge-target-text: #81E6D9;
            --badge-type-bg: #2D3748;
            --badge-type-text: #CBD5E0;
            --globe-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 4px 16px rgba(0,0,0,0.3);
        }

        /* ================= 1b. Theme Toggle Button ================= */
        .theme-toggle {
            width: 26px;
            height: 26px;
            border-radius: 50%;
            border: 1px solid var(--btn-border);
            background: var(--sidebar-bg);
            color: var(--text-sidebar);
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.25s ease;
            vertical-align: middle;
            flex-shrink: 0;
        }
        .theme-toggle:hover {
            border-color: #F59E0B;
            background: rgba(245, 158, 11, 0.08);
        }
        .theme-toggle svg {
            width: 14px;
            height: 14px;
            transition: transform 0.4s ease;
        }
        .theme-toggle:active svg {
            transform: rotate(180deg);
        }

        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: var(--bg-color); color: var(--text-main); display: flex; min-height: 100vh; }
        
        /* ================= 2. 全局布局 ================= */
        .app-container { display: flex; width: 100%; }
        
        /* --- 侧边栏 --- */
        .sidebar { 
            width: 300px; 
            background-color: var(--sidebar-bg); 
            border-right: 1px solid var(--border-color); 
            padding: 20px 20px; /* 减少顶部内边距 */
            flex-shrink: 0; 
            box-sizing: border-box; 
            position: sticky;
            top: 0;
            height: 100vh; 
            overflow-y: auto; 
        }
        
        .sidebar h2 { margin-top: 0; font-size: 1.5rem; margin-bottom: 5px; }
        .sidebar h2 a { 
            color: var(--text-sidebar); 
            text-decoration: none; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            transition: opacity 0.2s; 
        }
        .sidebar h2 a:hover { opacity: 0.75; }
        
        .sidebar-logo { height: 1.5rem; width: auto; flex-shrink: 0; }
        .sidebar p.caption { color: var(--meta-color); font-size: 0.9rem; margin-bottom: 5px; margin-left: 0; } /* 减少下方间距 */
        
        /* 控件与指标 */
        .filter-group { margin-bottom: 12px; } /* 缩小组件间距，原为20px */
        .filter-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 4px; color: var(--text-sidebar); } /* 缩小文字与输入框间距 */
        .filter-group select,
        .filter-group input { width: 100%; padding: 8px 10px; border: 1px solid var(--btn-border); border-radius: 6px; background-color: var(--bg-color); color: var(--text-main); outline: none; }
        
        .metric-card { margin-top: 15px; padding: 15px; background: rgba(0,0,0,0.02); border-radius: 12px; text-align: center; border: 1px solid var(--border-color); } /* 缩小外间距和内边距 */
        .metric-title { font-size: 0.8rem; color: var(--meta-color); letter-spacing: 1px; text-transform: uppercase; }
        .metric-value { font-size: 2.2rem; font-weight: 800; color: var(--text-sidebar); margin: 2px 0; }
        .metric-sub { font-size: 0.8rem; color: var(--meta-color); }

        /* Submit Button 样式 */
        .submit-btn { 
            width: 100%; 
            padding: 8px 10px; 
            margin-top: 8px; /* 缩小按钮间距 */
            background-color: var(--sidebar-bg); 
            color: var(--text-sidebar); 
            border: 1px solid var(--border-color); 
            border-radius: 6px; 
            font-weight: 600; 
            font-size: 0.85rem; 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            gap: 8px; 
            text-decoration: none; 
            box-sizing: border-box; 
            transition: all 0.2s ease; 
        }
        .submit-btn:hover { 
            border-color: #3B82F6; 
            color: #3B82F6; 
            background-color: #F8FAFC; 
        }

        .team-footer { margin-top: 25px; padding-top: 15px; border-top: 1px solid var(--border-color); text-align: center; } /* 缩小底部间距 */
        .team-footer div { font-size: 0.85rem; color: var(--text-sidebar); margin-bottom: 4px; }
        .team-footer a { color: var(--text-sidebar); text-decoration: none; border-bottom: 1px dotted; }

        /* --- 主内容区 --- */
        .main-content { flex: 1; padding: 40px; max-width: 1600px; box-sizing: border-box; margin: 0 auto; } 
        .main-content h1 { margin-top: 0; font-size: 1.8rem; margin-bottom: 30px; }
        
        .beta-badge {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 800;
            color: #3182CE; 
            background-color: #EBF8FF; 
            border: 1px solid #BEE3F8; 
            padding: 3px 8px;
            border-radius: 6px;
            margin-left: 12px;
            vertical-align: middle; 
            position: relative;
            top: -3px; 
            letter-spacing: 1px;
        }

        .main-content h1 a {
            color: var(--text-main);
            text-decoration: none; 
            transition: opacity 0.2s; 
        }
        .main-content h1 a:hover {
            opacity: 0.75; 
        }

        #feed-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(min(100%, 320px), 1fr)); 
            gap: 20px; 
            align-items: stretch; 
        }

        /* ================= 3. 探针卡片组件 ================= */
        .sensor-card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 10px; padding: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.02); display: flex; flex-direction: column; height: 100%; box-sizing: border-box; }
        .card-header { display: flex; align-items: flex-start; gap: 15px; flex: 1; }
        .color-dot { width: 14px; height: 14px; border-radius: 50%; flex-shrink: 0; margin-top: 6px; }
        
        .card-body { flex: 1; min-width: 0; }
        
        .probe-info-stream {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 8px 10px; 
            margin-bottom: 15px;
            line-height: 1.2;
        }
        
        .probe-title { font-size: 1.2rem; font-weight: 700; color: var(--text-main); }
        .badge-target { background-color: var(--badge-target-bg); color: var(--badge-target-text); padding: 4px 10px; border-radius: 100px; font-size: 0.75rem; font-weight: 600; }
        .badge-type { background-color: var(--badge-type-bg); color: var(--badge-type-text); padding: 4px 10px; border-radius: 100px; font-size: 0.75rem; }
        .badge-new { background: linear-gradient(135deg, #FFD700 0%, #F59E0B 100%); color: white; padding: 3px 6px; border-radius: 4px; font-size: 0.7rem; font-weight: 800; box-shadow: 0 2px 5px rgba(245, 158, 11, 0.4); }
        .meta-text { font-size: 0.85rem; color: var(--meta-color); display: flex; align-items: center; gap: 6px; }
        
        details { background: rgba(0,0,0,0.01); border-radius: 6px; border: 1px solid var(--border-color); padding: 10px 15px; width: 100%; box-sizing: border-box; }
        summary { font-size: 0.9rem; font-weight: 600; cursor: pointer; color: var(--text-sidebar); outline: none; }
        details p { font-size: 0.9rem; line-height: 1.6; color: var(--text-main); opacity: 0.85; margin-top: 10px; margin-bottom: 0; }

        .read-btn { align-self: flex-start; background-color: var(--card-bg); border: 1px solid var(--btn-border); color: var(--text-sidebar); padding: 8px 16px; border-radius: 6px; text-decoration: none; font-size: 0.9rem; font-weight: 600; transition: all 0.2s; margin-top: 15px; text-align: center; }
        .read-btn:hover { background-color: var(--bg-color); border-color: #A0AEC0; transform: translateY(-1px); }

        /* ================= 4. Globe Widget ================= */
        .globe-widget {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 16px auto 10px auto;
            border-radius: 50%;
            overflow: hidden;
            box-shadow: var(--globe-shadow);
            background: transparent;
        }
        .globe-widget iframe {
            width: 100%;
            height: 100%;
            border: none;
            display: block;
        }
        .globe-widget .globe-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* ================= 5. 移动端响应式优化 ================= */
        @media (max-width: 1024px) {
            .app-container { flex-direction: column; }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border-color);
                padding: 20px;
                position: relative;
                height: auto;
                overflow: visible;
            }
            .main-content { padding: 20px; }
            .main-content h1 { font-size: 1.5rem; }
            #feed-container { grid-template-columns: 1fr; }
            .globe-widget { display: none; }
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="sidebar">
        <h2>
            <a href="https://sensor.cns.ac.cn">
                <img src="/image/pulumi.svg" alt="Auto Sensor Base Logo" class="sidebar-logo">Auto Sensor Base
            </a>
        </h2>
        <p class="caption">AI-powered Biosensor Tracking System</p>

        <p style="color: #a766ad; font-weight: 600; font-size: 0.8rem; margin-top: 0; margin-bottom: 15px; margin-left: 0;">
            <span id="last-update">Last update: Fetching...</span>
            <button class="theme-toggle" id="theme-toggle" title="Toggle dark/light mode" aria-label="Toggle dark mode" style="margin-left: 10px;">
                <svg id="theme-icon-sun" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                    <circle cx="12" cy="12" r="5"></circle>

                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg id="theme-icon-moon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </p>

        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 15px 0;">
        
        <div class="filter-group">
            <label for="search-input">Search Database</label>
            <input type="text" id="search-input" placeholder="Type name, journal, or abstract..." 
                style="width: 100%; padding: 8px 10px; border: 1px solid var(--btn-border); border-radius: 6px; box-sizing: border-box;">
        </div>

        <div class="filter-group">
            <label for="target-filter">Target Molecule</label>
            <select id="target-filter">
                <option value="All">All</option>
            </select>
        </div>
                
        <div class="filter-group">
            <label for="color-filter">Fluorescence Color</label>
            <select id="color-filter">
                <option value="All">All</option>
            </select>
        </div>

        <div class="metric-card">
            <div class="metric-title">TOTAL SENSORS</div>
            <div class="metric-value" id="total-count">0</div>
            <div class="metric-sub" id="year-range">(N/A - N/A)</div>
        </div>

        <button id="download-csv-btn" style="width: 100%; padding: 8px 10px; margin-top: 15px; background-color: var(--sidebar-bg); color: var(--text-sidebar); border: 1px solid var(--btn-border); border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background-color 0.2s, border-color 0.2s;" onmouseover="this.style.backgroundColor='#F7FAFC'; this.style.borderColor='#A0AEC0'" onmouseout="this.style.backgroundColor='var(--sidebar-bg)'; this.style.borderColor='var(--btn-border)'">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">

                <polyline points="14 2 14 8 20 8"></polyline>
                <path d="M12 18v-6"></path>
                <path d="M9 15l3 3 3-3"></path>
            </svg>
            Download Filtered List (CSV)
        </button>

        <a href="https://github.com/Epivitae/AutoSensorBase/issues/new?template=add_probe.yml" target="_blank" rel="noopener noreferrer" class="submit-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
                <line x1="12" y1="18" x2="12" y2="12"></line>
                <line x1="9" y1="15" x2="15" y2="15"></line>
            </svg>
            Submit a Sensor
        </a>

        <div class="team-footer">
            <div style="font-weight: 600;">Chimera Nano Sensor Team</div>

        </div>

        <!-- Visitor Globe Widget -->
        <div class="globe-widget">
            <iframe src="globe.html" scrolling="no" title="Global Visitors" allow="webgl"></iframe>
            <a class="globe-overlay" href="globe.html" target="_blank" title="View full globe"></a>
        </div>

    <div class="main-content">
        <h1>
            <a href="https://sensor.cns.ac.cn" style="display: inline-flex; align-items: center; text-decoration: none; color: inherit;">
                The Living Database of Genetically Encoded Indicators (Sensors)<span class="beta-badge">BETA</span>
            </a>
            <a href="https://github.com/Epivitae/AutoSensorBase" target="_blank" rel="noopener noreferrer" style="margin-left: 10px; display: inline-flex; align-items: center; text-decoration: none; color: inherit;" title="View on GitHub">
                <svg viewBox="0 0 16 16" width="16" height="16" fill="currentColor" aria-hidden="true" style="margin-bottom: -3px;">
                    <path d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"></path>
                </svg>
            </a>
        </h1>
        <div id="feed-container">
            <p style="color: var(--meta-color);">⏳ Loading database...</p>
        </div>
    </div>
</div>

<script>
    // ================= Theme Toggle =================
    (function() {
        const html = document.documentElement;
        const toggle = document.getElementById('theme-toggle');
        const iconSun = document.getElementById('theme-icon-sun');
        const iconMoon = document.getElementById('theme-icon-moon');

        function setTheme(theme) {
            html.setAttribute('data-theme', theme);
            iconSun.style.display = theme === 'dark' ? '' : 'none';
            iconMoon.style.display = theme === 'dark' ? 'none' : '';
            try { localStorage.setItem('asb-theme', theme); } catch(e) {}
        }

        // Init: prefer saved, then system, default light
        let saved;
        try { saved = localStorage.getItem('asb-theme'); } catch(e) {}
        if (saved === 'dark' || saved === 'light') {
            setTheme(saved);
        } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
            setTheme('dark');
        }
        // default is light (no data-theme attribute needed)

        toggle.addEventListener('click', () => {
            const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            setTheme(next);
        });
    })();

    let globalData = [];
    let currentFilteredData = [];
    let currentPage = 1;
    const itemsPerPage = 20;

    function getColorHex(colorName) {
        if (!colorName) return "#D1D5DB";
        const c = String(colorName).toLowerCase();
        if (c.includes("green")) return "#10B981";
        if (c.includes("red")) return "#EF4444";
        if (c.includes("blue") || c.includes("cyan")) return "#3B82F6";
        if (c.includes("yellow") || c.includes("gold")) return "#F59E0B";
        if (c.includes("orange")) return "#F97316";
        if (c.includes("purple")) return "#8B5CF6";
        return "#D1D5DB";
    }

    async function init() {
        try {
            try {
                const metaUrl = 'update_meta.json?t=' + new Date().getTime();
                const metaResponse = await fetch(metaUrl);
                if (metaResponse.ok) {
                    const metaData = await metaResponse.json();
                    document.getElementById('last-update').innerText = `Last update: ${metaData.last_update}`;
                } else {
                    document.getElementById('last-update').innerText = `Last update: Live`;
                }
            } catch (e) {
                console.warn("Could not fetch meta update time", e);
                document.getElementById('last-update').innerText = `Last update: Live`;
            }

            const fetchUrl = 'processed_probes.json?t=' + new Date().getTime();
            const response = await fetch(fetchUrl);
            const rawData = await response.json();

            // 1. 遍历原始数据，给每个探针加上一个 originalIndex 属性，记录它在 JSON 中的原始位置
            globalData = rawData.map((item, index) => {
                return { ...item, originalIndex: index };
            });

            // 2. 执行多条件排序
            globalData.sort((a, b) => {
                // 条件 1：比较年份 (降序：大年份在前)
                const yearDiff = parseInt(b.date || 0) - parseInt(a.date || 0);
                
                if (yearDiff !== 0) {
                    return yearDiff; // 如果年份不同，直接按年份排序结果返回
                } else {
                    // 条件 2：如果年份相同，比较原始索引 (降序：后出现的排前面)
                    return b.originalIndex - a.originalIndex; 
                }
            });

            currentFilteredData = [...globalData];

            populateFilters(globalData);
            
            document.getElementById('feed-container').innerHTML = '';
            renderFeedChunk();
            
            document.getElementById('target-filter').addEventListener('change', handleFilterChange);
            document.getElementById('color-filter').addEventListener('change', handleFilterChange);

        } catch (error) {
            document.getElementById('feed-container').innerHTML = `<p style="color: red;">❌ Failed to load data. Ensure 'processed_probes.json' exists.</p>`;
            document.getElementById('last-update').innerText = "Last update: Unknown";
        }
        document.getElementById('download-csv-btn').addEventListener('click', downloadCSV);
    }

    function populateFilters(data) {
        const targets = new Set();
        const colors = new Set();
        
        data.forEach(item => {
            if (item.target) targets.add(item.target);
            if (item.color) colors.add(item.color);
        });

        const targetSelect = document.getElementById('target-filter');
        const colorSelect = document.getElementById('color-filter');

        Array.from(targets).sort().forEach(t => targetSelect.add(new Option(t, t)));
        Array.from(colors).sort().forEach(c => colorSelect.add(new Option(c, c)));
    }

    function handleFilterChange() {
        const targetVal = document.getElementById('target-filter').value;
        const colorVal = document.getElementById('color-filter').value;

        currentFilteredData = globalData.filter(item => {
            const matchTarget = (targetVal === "All") || (String(item.target) === targetVal);
            const matchColor = (colorVal === "All") || (String(item.color) === colorVal);
            return matchTarget && matchColor;
        });

        currentPage = 1;
        document.getElementById('feed-container').innerHTML = '';
        renderFeedChunk();
    }


    const currentFilters = {
        search: "",
        target: "All",
        color: "All"
    };

    function performSearch() {
        const searchTerm = document.getElementById('search-input').value.toLowerCase();
        
        currentFilteredData = globalData.filter(item => {
            const searchableContent = [
                item.probe_name, 
                item.target, 
                item.journal, 
                item.abstract, 
                item.type
            ].join(" ").toLowerCase();
            
            const matchSearch = searchableContent.includes(searchTerm);
            const matchTarget = (currentFilters.target === "All") || (String(item.target) === currentFilters.target);
            const matchColor = (currentFilters.color === "All") || (String(item.color) === currentFilters.color);
            
            return matchSearch && matchTarget && matchColor;
        });

        currentPage = 1;
        document.getElementById('feed-container').innerHTML = '';
        renderFeedChunk();
    }

    let debounceTimer;
    document.getElementById('search-input').addEventListener('input', (e) => {
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            performSearch();
        }, 200); 
    });


    function renderFeedChunk() {
        const container = document.getElementById('feed-container');
        const oldLoadBtn = document.getElementById('load-more-btn');
        if (oldLoadBtn) oldLoadBtn.remove();

        if (currentFilteredData.length === 0) {
            container.innerHTML = '<p style="color: var(--meta-color);">No sensors match your filters.</p>';
            updateMetrics(0, "N/A", "N/A");
            return;
        }

        const startIndex = (currentPage - 1) * itemsPerPage;
        const endIndex = startIndex + itemsPerPage;
        const itemsToRender = currentFilteredData.slice(startIndex, endIndex);
        const currentYear = new Date().getFullYear();
        const fragment = document.createDocumentFragment();

        itemsToRender.forEach(item => {
            const year = parseInt(item.date);
            const isNew = item.is_new || String(year) === String(currentYear) || String(year) === String(currentYear + 1);
            const hexColor = getColorHex(item.color);
            const title = item.probe_name && item.probe_name !== "Unknown" ? item.probe_name : item.type;

            const card = document.createElement('div');
            card.className = 'sensor-card';
            
            card.innerHTML = `
                <div class="card-header">
                    <div class="color-dot" style="background-color: ${hexColor}; box-shadow: 0 0 0 2px ${hexColor}30;"></div>
                    <div class="card-body">
                        
                        <div class="probe-info-stream">
                            <span class="probe-title">${title}</span>
                            ${isNew ? '<span class="badge-new">NEW</span>' : ''}
                            ${item.target ? `<span class="badge-target">${item.target}</span>` : ''}
                            ${item.type ? `<span class="badge-type">${item.type}</span>` : ''}
                            <span class="meta-text"><i>${item.journal || 'Unknown'}</i></span>
                            <span class="meta-text" style="color: var(--border-color);">•</span>
                            <span class="meta-text">📅 ${item.date || 'N/A'}</span>
                        </div>

                        <details>
                            <summary>View Abstract</summary>
                            <p>${item.abstract || 'No abstract available.'}</p>
                        </details>
                    </div>
                </div>
                ${item.doi && item.doi.includes('http') ? `<a href="${item.doi}" target="_blank" class="read-btn">Read Paper</a>` : ''}
            `;
            fragment.appendChild(card);
        });

        container.appendChild(fragment);

        if (endIndex < currentFilteredData.length) {
            const loadBtn = document.createElement('button');
            loadBtn.id = 'load-more-btn';
            loadBtn.innerText = `Load More (${currentFilteredData.length - endIndex} left)`;
            loadBtn.style.cssText = `
                grid-column: 1 / -1; 
                width: calc(100% - 20px); max-width: 400px; justify-self: center;
                padding: 12px; margin-top: 10px; background: #fff; 
                border: 1px dashed var(--btn-border); border-radius: 8px; 
                color: var(--meta-color); font-weight: 600; cursor: pointer;
            `;
            loadBtn.onmouseover = () => loadBtn.style.borderColor = '#A0AEC0';
            loadBtn.onmouseout = () => loadBtn.style.borderColor = 'var(--btn-border)';
            
            loadBtn.onclick = () => {
                currentPage++;
                renderFeedChunk();
            };
            container.appendChild(loadBtn);
        }
        updateMetrics(currentFilteredData.length);
    }

    function updateMetrics(count) {
        document.getElementById('total-count').innerText = count;
        let minYear = 9999, maxYear = 0;
        currentFilteredData.forEach(item => {
            const year = parseInt(item.date);
            if (!isNaN(year)) {
                if (year < minYear) minYear = year;
                if (year > maxYear) maxYear = year;
            }
        });
        document.getElementById('year-range').innerText = count > 0 ? `(${minYear} - ${maxYear})` : "(N/A - N/A)";
    }

    function downloadCSV() {
        if (!currentFilteredData || currentFilteredData.length === 0) {
            alert("No data available to download under current filters!");
            return;
        }
        const headers = ["Probe Name", "Target", "Color", "Type", "Journal", "Year", "DOI", "Paper Title"];
        let csvContent = headers.join(",") + "\n";
        
        currentFilteredData.forEach(item => {
            const cleanStr = (str) => {
                if (!str) return "";
                let s = String(str).replace(/"/g, '""');
                if (s.includes(",") || s.includes("\n") || s.includes('"')) { s = `"${s}"`; }
                return s;
            };
            const row = [ cleanStr(item.probe_name), cleanStr(item.target), cleanStr(item.color), cleanStr(item.type), cleanStr(item.journal), cleanStr(item.date), cleanStr(item.doi), cleanStr(item.title) ];
            csvContent += row.join(",") + "\n";
        });

        const blob = new Blob(["\uFEFF" + csvContent], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        const today = new Date().toISOString().slice(0, 10).replace(/-/g, "");
        link.setAttribute("download", `AutoSensorBase_Export_${today}.csv`);
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    init();
</script>
</body>
</html>
